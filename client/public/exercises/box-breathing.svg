<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Box Breathing animated demonstration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071114"/>
      <stop offset="100%" stop-color="#0d1f28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="452" rx="20" fill="#10232d" stroke="#8bd8ff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" fill="#e8f7f0" font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="700">Box Breathing</text>
  
  <rect x="335" y="120" width="130" height="130" rx="8" fill="none" stroke="#5b7a88" stroke-width="5"/>
  <text x="317" y="191.0" text-anchor="end" fill="#e8f7f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" opacity="0.35">Inhale 4<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.250;1.000" values="1;0.35;0.35"/></text>
  <text x="400.0" y="104" text-anchor="middle" fill="#e8f7f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" opacity="0.35">Hold 4<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.250;0.500;1.000" values="0.35;1;0.35;0.35"/></text>
  <text x="483" y="191.0" text-anchor="start" fill="#e8f7f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" opacity="0.35">Exhale 4<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.500;0.750;1.000" values="0.35;1;0.35;0.35"/></text>
  <text x="400.0" y="284" text-anchor="middle" fill="#e8f7f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" opacity="0.35">Hold 4<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.750;1.000" values="0.35;1;1"/></text>
  <circle r="11" fill="#b6f36b"><animateMotion dur="16s" repeatCount="indefinite" path="M335 250 L335 120 L465 120 L465 250 L335 250" calcMode="linear"/></circle>
  <text x="400" y="352" text-anchor="middle" fill="#cfe7de" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Inhale 4 · Hold 4 · Exhale 4 · Hold 4</text>
  <text x="400" y="384" text-anchor="middle" fill="#8ba19a" font-family="Segoe UI, system-ui, sans-serif" font-size="18">Breathe in through your nose, out through your mouth</text>
  <text x="400" y="414" text-anchor="middle" fill="#8ba19a" font-family="Segoe UI, system-ui, sans-serif" font-size="18">Stop if you feel lightheaded</text>
  <text x="400" y="456" text-anchor="middle" fill="#60756f" font-family="ui-monospace, monospace" font-size="12">FitTV AI · animated form guide</text>
